<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de tiquetes - Susuerte</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 18px;
            padding: 10px 16px;
            cursor: pointer;
        }

        #mensaje {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .mensaje-exito {
            display: block;
            background: #e6ffed;
            border: 1px solid #8ad69b;
            color: #1f6f35;
        }

        .mensaje-error {
            display: block;
            background: #ffecec;
            border: 1px solid #e39a9a;
            color: #8a1f1f;
        }

        .mensaje-alerta {
            display: block;
            background: #fff8e1;
            border: 1px solid #e0c15a;
            color: #6b5600;
        }

        .lista-contenedor {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .tiquete-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .tiquete-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Registro de tiquetes</h1>

    <form id="formTiquete">
        <label for="usuarioId">ID del usuario</label>
        <input
            type="number"
            id="usuarioId"
            name="usuarioId"
            min="1"
            required
            placeholder="Ejemplo: 1"
        >

        <label for="monto">Monto a apostar</label>
        <input
            type="number"
            id="monto"
            name="monto"
            min="1"
            step="0.01"
            required
            placeholder="Ejemplo: 5000"
        >

        <button type="submit">Crear tiquete</button>
    </form>

    <div id="mensaje"></div>

    <section class="lista-contenedor">
        <h2>Tiquetes creados en esta sesión</h2>
        <div id="listaTiquetes">
            <p id="listaVacia">Aún no se han creado tiquetes desde esta página.</p>
        </div>
    </section>

    <script>
        const formTiquete = document.getElementById('formTiquete');
        const mensaje = document.getElementById('mensaje');
        const listaTiquetes = document.getElementById('listaTiquetes');
        const listaVacia = document.getElementById('listaVacia');

        formTiquete.addEventListener('submit', async function (event) {
            event.preventDefault();

            const usuarioId = document.getElementById('usuarioId').value;
            const monto = document.getElementById('monto').value;

            limpiarMensaje();

            try {
                const respuesta = await fetch('/api/tiquetes.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario_id: Number(usuarioId),
                        monto: Number(monto)
                    })
                });

                const data = await respuesta.json();

                if (respuesta.status === 201) {
                    mostrarMensaje('Tiquete creado correctamente.', 'exito');
                    agregarTiqueteALista(data.tiquete);
                    formTiquete.reset();
                    return;
                }

                if (respuesta.status === 400) {
                    mostrarMensaje(data.error || 'La solicitud tiene datos inválidos.', 'error');
                    return;
                }

                if (respuesta.status === 404) {
                    mostrarMensaje(data.error || 'El usuario no fue encontrado.', 'error');
                    return;
                }

                if (respuesta.status === 422) {
                    mostrarMensaje(data.error || 'El usuario no tiene saldo suficiente.', 'alerta');
                    return;
                }

                mostrarMensaje(data.error || 'Ocurrió un error inesperado.', 'error');
            } catch (error) {
                mostrarMensaje('No se pudo conectar con el servidor.', 'error');
            }
        });

    function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = '';
        mensaje.style.display = 'block';

        if (tipo === 'exito') {
            mensaje.classList.add('mensaje-exito');
        } else if (tipo === 'alerta') {
            mensaje.classList.add('mensaje-alerta');
        } else {
            mensaje.classList.add('mensaje-error');
        }
    }

    function limpiarMensaje() {
        mensaje.textContent = '';
        mensaje.className = '';
        mensaje.style.display = 'none';
    }

        function agregarTiqueteALista(tiquete) {
            if (listaVacia) {
                listaVacia.remove();
            }

            const item = document.createElement('div');
            item.classList.add('tiquete-item');

            item.innerHTML = `
                <strong>Tiquete #${tiquete.id}</strong><br>
                Usuario ID: ${tiquete.usuario_id}<br>
                Monto: ${tiquete.monto}<br>
                Estado: ${tiquete.estado}<br>
                Saldo anterior: ${tiquete.saldo_anterior}<br>
                Saldo actual: ${tiquete.saldo_actual}
            `;

            listaTiquetes.prepend(item);
        }
    </script>
</body>
</html>
